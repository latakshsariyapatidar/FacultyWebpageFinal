# ============================================
# Faculty Website - Docker Compose
# Full-stack deployment configuration
#
# Services:
#   backend  → Express API (port 8000, internal)
#   frontend → React + Nginx reverse proxy (port 80, exposed)
#   admin    → Admin panel (port 7997, internal)
#
# Usage:
#   docker compose up --build          # Build & start all services
#   docker compose up -d               # Start in background
#   docker compose down                # Stop all services
#   docker compose logs -f backend     # Tail backend logs
# ============================================

services:
  # ---- Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faculty-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - faculty_data:/app/data
    networks:
      - faculty-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Admin Panel ----
  admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile.admin
    container_name: faculty-admin
    restart: unless-stopped
    environment:
      - PORT=7997
      - HOST=0.0.0.0
    networks:
      - faculty-network

  # ---- Frontend (Nginx + React Build) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faculty-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      admin:
        condition: service_started
    networks:
      - faculty-network

# ---- Persistent Volumes ----
volumes:
  faculty_data:
    driver: local

# ---- Internal Network ----
networks:
  faculty-network:
    driver: bridge
